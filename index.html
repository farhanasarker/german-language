<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="apple-touch-icon" href="/german-language/icons/icon-192.png" />
  <title>German B1 Flashcards</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      line-height: 1.5;
      min-height: 100vh;
    }
    #app { max-width: 720px; margin: 0 auto; padding: 16px; }
    button {
      cursor: pointer; font: inherit; border: none; border-radius: 8px;
      padding: 10px 20px; font-weight: 600; transition: opacity 0.15s;
    }
    button:active { opacity: 0.7; }
    button.primary { background: #2563eb; color: #fff; }
    button.secondary { background: #e5e7eb; color: #374151; }
    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
